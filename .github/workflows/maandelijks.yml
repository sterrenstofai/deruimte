name: Maandelijks verversen

# Haalt de ruwe data opnieuw op (NASA, JPL, Wikidata, d3-celestial), kijkt de weetjes na tegen hun bronnen
# en bouwt site/data opnieuw. Een weetje dat niet meer op zijn bronpagina staat, verliest het label "nagekeken".
on:
  schedule:
    - cron: "23 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verversen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/ruw_ophalen.py
      - run: python3 scripts/nakijken.py
      - run: python3 scripts/bouw_site_data.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Maandelijkse verversing van de data"
          git pull --rebase origin main
          git push
