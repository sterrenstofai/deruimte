name: ISS-baangegevens

# Elke dag de baangegevens (TLE) van het ISS, voor "wat zie je vanavond".
# CelesTrak wil hooguit één download per update en dat je stopt bij een fout; één keer per dag is ruim genoeg.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/tle_ophalen.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/iss.json
          git diff --cached --quiet || git commit -m "ISS-baangegevens ververst"
          git pull --rebase origin main
          git push
